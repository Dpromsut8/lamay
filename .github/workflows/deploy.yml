name: Deploy Static Content to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm' # เพิ่มการแคช npm เพื่อความเร็วในการรันซ้ำ

      - name: Install Dependencies
        run: npm ci # ใช้ npm ci เหมาะสำหรับ CI/CD

      - name: Build Web
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'   # ตรวจสอบว่าตรงกับโฟลเดอร์ผลลัพธ์หลัง build ของโปรเจกต์จริง
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
